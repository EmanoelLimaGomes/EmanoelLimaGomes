name: Scarlet snake

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/scarlet-snake.svg?color_snake=#c9a227&color_dots=#ebedf0,#f4c7c3,#e06666,#b31b1b,#6e0b0b
            dist/scarlet-snake-dark.svg?palette=github-dark&color_snake=#c9a227&color_dots=#161b22,#4a0d0d,#7a1414,#b31b1b,#e63939

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
