<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="96" height="96" shape-rendering="crispEdges">
  <style>
    .f { animation: pulse 2.4s ease-in-out infinite; transform-origin: 8px 7px; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  </style>
  <!-- caule -->
  <rect x="7" y="9" width="2" height="6" fill="#3d6b2a"/>
  <rect x="5" y="12" width="2" height="1" fill="#3d6b2a"/>
  <rect x="9" y="11" width="2" height="1" fill="#3d6b2a"/>
  <g class="f">
    <!-- pétalas -->
    <rect x="6" y="1" width="4" height="2" fill="#e63939"/>
    <rect x="2" y="5" width="2" height="4" fill="#e63939"/>
    <rect x="12" y="5" width="2" height="4" fill="#e63939"/>
    <rect x="6" y="10" width="4" height="1" fill="#b31b1b"/>
    <rect x="4" y="3" width="8" height="7" fill="#b31b1b"/>
    <rect x="3" y="4" width="10" height="5" fill="#b31b1b"/>
    <rect x="5" y="3" width="2" height="2" fill="#e63939"/>
    <rect x="10" y="7" width="2" height="2" fill="#7a1414"/>
    <rect x="4" y="7" width="2" height="1" fill="#7a1414"/>
    <!-- miolo dourado -->
    <rect x="7" y="5" width="2" height="3" fill="#c9a227"/>
    <rect x="6" y="6" width="4" height="1" fill="#c9a227"/>
    <rect x="7" y="6" width="1" height="1" fill="#f3d97a"/>
  </g>
</svg>
