<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 20" width="80" height="100" shape-rendering="crispEdges">
  <style>
    .shine { animation: shine 2.6s steps(1) infinite; }
    @keyframes shine { 0%,70% { opacity: 0; } 71%,85% { opacity: 1; } 86%,100% { opacity: 0; } }
  </style>
  <!-- lâmina -->
  <rect x="7" y="0" width="2" height="1" fill="#e8e8ef"/>
  <rect x="6" y="1" width="4" height="11" fill="#b8bcc8"/>
  <rect x="7" y="1" width="1" height="11" fill="#e8e8ef"/>
  <rect x="9" y="1" width="1" height="11" fill="#7d8190"/>
  <rect x="7" y="3" width="1" height="7" fill="#b31b1b" opacity="0.55"/>
  <rect class="shine" x="7" y="2" width="2" height="2" fill="#ffffff"/>
  <!-- guarda -->
  <rect x="2" y="12" width="12" height="2" fill="#c9a227"/>
  <rect x="2" y="12" width="12" height="1" fill="#f3d97a"/>
  <rect x="1" y="11" width="2" height="2" fill="#9c7a16"/>
  <rect x="13" y="11" width="2" height="2" fill="#9c7a16"/>
  <!-- cabo -->
  <rect x="7" y="14" width="2" height="4" fill="#5a2a14"/>
  <rect x="7" y="15" width="2" height="1" fill="#7a3a1c"/>
  <rect x="7" y="17" width="2" height="1" fill="#7a3a1c"/>
  <!-- pomo -->
  <rect x="6" y="18" width="4" height="2" fill="#c9a227"/>
  <rect x="7" y="18" width="2" height="1" fill="#b31b1b"/>
</svg>
