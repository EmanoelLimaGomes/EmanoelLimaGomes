<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 16" width="120" height="96" shape-rendering="crispEdges">
  <style>
    .h { animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    .eye { animation: blink 3s steps(1) infinite; }
    @keyframes blink { 0%,80% { fill: #14060a; } 81%,100% { fill: #e63939; } }
  </style>
  <g class="h">
    <!-- asas -->
    <rect x="1" y="1" width="1" height="3" fill="#f3d97a"/>
    <rect x="2" y="2" width="1" height="4" fill="#c9a227"/>
    <rect x="3" y="4" width="1" height="4" fill="#c9a227"/>
    <rect x="4" y="6" width="2" height="2" fill="#9c7a16"/>
    <rect x="18" y="1" width="1" height="3" fill="#f3d97a"/>
    <rect x="17" y="2" width="1" height="4" fill="#c9a227"/>
    <rect x="16" y="4" width="1" height="4" fill="#c9a227"/>
    <rect x="14" y="6" width="2" height="2" fill="#9c7a16"/>
    <!-- elmo -->
    <rect x="8" y="3" width="4" height="1" fill="#f3d97a"/>
    <rect x="7" y="4" width="6" height="1" fill="#c9a227"/>
    <rect x="6" y="5" width="8" height="7" fill="#c9a227"/>
    <rect x="7" y="12" width="6" height="1" fill="#9c7a16"/>
    <rect x="7" y="5" width="2" height="2" fill="#f3d97a"/>
    <rect class="eye" x="7" y="8" width="6" height="1"/>
    <!-- cabelo -->
    <rect x="5" y="10" width="1" height="5" fill="#b31b1b"/>
    <rect x="14" y="10" width="1" height="5" fill="#b31b1b"/>
    <rect x="6" y="12" width="1" height="4" fill="#7a1414"/>
    <rect x="13" y="12" width="1" height="4" fill="#7a1414"/>
  </g>
</svg>
